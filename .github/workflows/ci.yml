name: CI

on:
  push:
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - LICENSE
      - dev/**
      - docs/**
      - docs_legacy/**
      - examples/**
      - .agents/**
      - .claude/**
      - .codex/**
      - .entire/**
      - .gemini/**
      - .github/ISSUE_TEMPLATE/**
      - .env.example
      - .gitattributes
      - .gitignore
      - .readthedocs.yaml
  pull_request:
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - LICENSE
      - dev/**
      - docs/**
      - docs_legacy/**
      - examples/**
      - .agents/**
      - .claude/**
      - .codex/**
      - .entire/**
      - .gemini/**
      - .github/ISSUE_TEMPLATE/**
      - .env.example
      - .gitattributes
      - .gitignore
      - .readthedocs.yaml

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
          # Runtime/package matrix for the Python versions supported by PyDPlus 2.x.
          os: [ ubuntu-latest, macos-latest, windows-latest ]
          python-version: [ "3.12", "3.13", "3.14", "3.15" ]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry --version

      - name: Install project (with dev dependencies)
        run: poetry install --with dev --no-interaction --no-ansi

#      - name: Decrypt the helper configuration file
#        run: ./.github/scripts/decrypt_helper.sh
#        env:
#          HELPER_DECRYPT_PASSPHRASE: ${{ secrets.HELPER_DECRYPT_PASSPHRASE }}

      - name: Lint and format check with Ruff
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Run tests
        run: |
          poetry run pytest -q

      # Bandit can log "[manager] ERROR" for every file, scan nothing, and still exit 0
      # when it does not support the running Python version (#10). Findings are reported
      # by the dedicated Bandit job, so this step fails only on analyzer errors.
      - name: Check Bandit compatibility with Python ${{ matrix.python-version }}
        if: matrix.os == 'ubuntu-latest'
        run: |
          poetry run bandit --version
          poetry run bandit -r src -q > bandit.log 2>&1 || true
          cat bandit.log
          if grep -q "\[manager\] ERROR" bandit.log; then
            echo "::error::Bandit could not analyze src on Python ${{ matrix.python-version }}"
            exit 1
          fi

      - name: Coverage (pytest-cov) and report
        run: |
          poetry run pytest --cov-report=xml --cov=pydplus tests/unit tests/integration --color=yes

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build sdist and wheel (Poetry)
        run: |
          poetry build

  bandit:
    name: Bandit (security static analysis)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry and project
        run: |
          python -m pip install --upgrade pip pipx
          pipx install poetry
          poetry install --with dev --no-interaction --no-ansi
          poetry run python -m pip install --upgrade bandit

      - name: Run Bandit (SARIF output)
        continue-on-error: true
        run: |
          poetry run bandit -r src \
            -f sarif \
            -o bandit.sarif

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
